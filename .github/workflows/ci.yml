name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.6.6", "latest"]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          for dir in . examples/basic; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Test
        run: terraform test

  mirror:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: raysecurity-k3s-public
      PREFIX: terraform-modules/aws-customer
      NAME: terraform-aws-ray-integrations
    steps:
      - uses: actions/checkout@v6

      - name: Build zip
        run: |
          mkdir dist
          git archive --format=zip -o "dist/${NAME}.zip" "$GITHUB_SHA"
          (cd dist && sha256sum "${NAME}.zip" > "${NAME}.zip.sha256")

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/1042129520407/locations/global/workloadIdentityPools/github/providers/github
          service_account: ray-integrations-publisher@raysecurity-shared-resources.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Upload
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          gcloud storage cp --if-generation-match=0 "dist/${NAME}.zip" "dist/${NAME}.zip.sha256" "gs://${BUCKET}/${PREFIX}/${VERSION}/"
          gcloud storage cp --cache-control="no-cache, max-age=0" "dist/${NAME}.zip" "dist/${NAME}.zip.sha256" "gs://${BUCKET}/${PREFIX}/latest/"
          {
            echo "### Mirrored ${VERSION}"
            echo "- https://gateway.raysecurity.io/gcp/storage/${BUCKET}/${PREFIX}/${VERSION}/${NAME}.zip"
            echo "- https://storage.googleapis.com/${BUCKET}/${PREFIX}/${VERSION}/${NAME}.zip"
          } >> "$GITHUB_STEP_SUMMARY"
