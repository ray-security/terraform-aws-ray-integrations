name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag the version
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be X.Y.Z"; exit 1; }
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "${version} already tagged"
            exit 0
          fi
          git tag "${version}" "${GITHUB_SHA}"
          git push origin "${version}"
          echo "### Released ${version}" >> "$GITHUB_STEP_SUMMARY"
